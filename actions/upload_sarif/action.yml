name: Upload SARIF to GitHub code scanning
description: >
  Uploads a SARIF file, such as the one export_sarif writes, to GitHub code
  scanning through GitHub's REST API, so it works from CircleCI as well as
  GitHub Actions, and with GitHub Enterprise Server. GitHub takes uploads for
  public repositories on github.com, and for private repositories and GitHub
  Enterprise Server only with GitHub Code Security (Advanced Security)
  enabled. It then waits for GitHub to process the file, and fails when GitHub
  rejects it. Needs jq, gzip and base64. The GitHub Actions twin of the orb's
  upload_sarif command.
author: juburr

inputs:
  api_url:
    description: >
      GitHub's API, such as https://github.example.com/api/v3 for GitHub
      Enterprise Server. Empty (the default) uses GITHUB_API_URL, then
      https://api.github.com.
    default: ""
  commit_sha:
    description: >
      The full SHA of the commit the analysis is of. Empty (the default) uses
      GITHUB_SHA or CIRCLE_SHA1.
    default: ""
  github_token:
    description: >
      Name of the environment variable that holds a GitHub token allowed to
      upload code scanning results: the security_events scope for a classic
      token, Code scanning alerts read and write for a fine-grained one, or
      security-events: write for a GitHub Actions job's token.
    default: GITHUB_TOKEN
  ref:
    description: >
      The Git ref the analysis is of: refs/heads/<branch>, refs/tags/<tag>, or
      refs/pull/<number>/head (or /merge). Empty (the default) uses GITHUB_REF
      on GitHub Actions, and on CircleCI the pull request
      (refs/pull/<number>/head), branch or tag the build is for.
    default: ""
  repository:
    description: >
      The GitHub repository, as owner/name. Empty (the default) uses the
      build's: GITHUB_REPOSITORY, or CIRCLE_PROJECT_USERNAME and
      CIRCLE_PROJECT_REPONAME.
    default: ""
  sarif_file:
    description: >
      The SARIF file to upload. Empty (the default) uses the one export_sarif
      exported (SONAR_SARIF_FILE).
    default: ""
  wait:
    description: >
      Wait for GitHub to process the upload, and fail when it can't.
    default: "true"
  wait_timeout:
    description: >
      With wait, how many seconds to wait.
    default: "120"
  when:
    description: >
      When the step runs: "always" also runs it after an earlier step failed,
      such as a scan whose quality gate failed. On GitHub Actions, give the
      step if: always() instead.
    default: on_success

runs:
  using: composite
  steps:
    - name: Upload SARIF to GitHub code scanning
      shell: bash
      env:
        PARAM_API_URL: ${{ inputs.api_url }}
        PARAM_COMMIT_SHA: ${{ inputs.commit_sha }}
        PARAM_GITHUB_TOKEN: ${{ inputs.github_token }}
        PARAM_REF: ${{ inputs.ref }}
        PARAM_REPOSITORY: ${{ inputs.repository }}
        PARAM_SARIF_FILE: ${{ inputs.sarif_file }}
        PARAM_WAIT: ${{ inputs.wait }}
        PARAM_WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/upload_sarif.sh"
        "SCRIPT_SONARQUBE_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/sonarqube.sh"
