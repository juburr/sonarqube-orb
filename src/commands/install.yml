description: >
  Installs the SonarScanner CLI for Linux on amd64 or arm64, picked from the
  machine's CPU architecture, after verifying its SHA-512 checksum. It
  installs SonarSource's package with its own Java runtime, so the executor
  needs no Java (cimg/base works), only bash, curl or wget, and unzip. Run
  this before scan.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the downloaded release between jobs, keyed by version, CPU
      architecture and home directory. Only verified releases are cached, and
      a cached release is verified again before it is installed.
  download_base_url:
    type: string
    default: ""
    description: >
      An https:// mirror to download from in place of
      https://binaries.sonarsource.com and Maven Central, such as an
      Artifactory or Nexus remote repository of either: the mirror is tried
      with SonarSource's paths (/Distribution/sonar-scanner-cli/...), then
      Maven's (/org/sonarsource/scanner/cli/...). The checksum table, not the
      mirror, decides what is installed. It must not hold credentials, a
      query or a fragment. Environment variables are expanded.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to install the scanner into: it holds
      the whole release (launcher, jar and Java runtime), and its bin
      directory is added to the PATH of later steps. It must be missing,
      empty, or an earlier install of this command's, and writable without
      root. Environment variables are expanded.
      Defaults to $HOME/.sonarqube-orb/sonar-scanner.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before downloading anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning: give those as
      the full version SonarSource publishes, such as 8.2.0.6438. "false"
      skips verification and is not recommended.
  version:
    type: string
    default: "8.2.0"
    description: >
      Version of the SonarScanner CLI to install, such as 8.2.0, or the full
      version with its build number, such as 8.2.0.6438. A leading "v" is
      ignored, and environment variables are expanded.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare SonarScanner CLI cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/sonarqube-orb-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: sonarqube-orb-v1-<< parameters.version >>-{{ checksum "/tmp/sonarqube-orb-cache-key" }}
  - run:
      name: Install SonarScanner CLI << parameters.version >>
      environment:
        PARAM_CACHING: << parameters.caching >>
        PARAM_DOWNLOAD_BASE_URL: << parameters.download_base_url >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: sonarqube-orb-v1-<< parameters.version >>-{{ checksum "/tmp/sonarqube-orb-cache-key" }}
            paths:
              - ~/.cache/sonarqube-orb
